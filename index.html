<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GeoZest: Geography Quiz on a 3D Globe</title>
    <meta
      name="description"
      content="A free geography quiz on a 3D globe. Learn where every country is, its flag, capital, languages and currency, and hear how each name is said."
    />
    <link rel="canonical" href="https://aumgupta.github.io/GeoZest/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GeoZest: Geography Quiz on a 3D Globe" />
    <meta
      property="og:description"
      content="A free geography quiz on a 3D globe. Learn where every country is, its flag, capital, languages and currency, and hear how each name is said."
    />
    <meta property="og:url" content="https://aumgupta.github.io/GeoZest/" />
    <meta property="og:image" content="https://aumgupta.github.io/GeoZest/docs/assets/screenshots/1.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeoZest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="map" aria-label="World map" role="img"><canvas id="cv"></canvas></div>
    <div class="tip" id="tip"></div>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="mg1o" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F2B98A" />
          <stop offset=".5" stop-color="#C47A3E" />
          <stop offset="1" stop-color="#7E3F14" />
        </linearGradient>
        <linearGradient id="mg1f" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E9A56E" />
          <stop offset="1" stop-color="#A65A22" />
        </linearGradient>
        <linearGradient id="mg2o" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF" />
          <stop offset=".5" stop-color="#C3CAD3" />
          <stop offset="1" stop-color="#7D8793" />
        </linearGradient>
        <linearGradient id="mg2f" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#EEF1F4" />
          <stop offset="1" stop-color="#AAB3BE" />
        </linearGradient>
        <linearGradient id="mg3o" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFF2A8" />
          <stop offset=".5" stop-color="#F2BE1D" />
          <stop offset="1" stop-color="#A86E00" />
        </linearGradient>
        <linearGradient id="mg3f" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFE266" />
          <stop offset="1" stop-color="#D99A00" />
        </linearGradient>
      </defs>
    </svg>
    <div class="tl">
      <div class="brand">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="50" />
          <path d="M71.16 13.36 59.25 55.33 28.84 86.64 40.75 44.67Z" /></svg
        >Geo<span class="sub">Zest</span>
      </div>
      <button class="fab" id="btnSearch" aria-label="Search">
        <svg class="i" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-4-4" />
        </svg>
      </button>
    </div>

    <div class="ctrl" id="ctrl">
      <button class="me" id="btnMe" aria-label="Level, progress and settings">
        <span class="lv" aria-hidden="true">LVL</span><b id="meLvl">1</b
        ><svg class="xpr" viewBox="0 0 44 44" aria-hidden="true">
          <path
            class="tr"
            d="M22 1.25H30A12.75 12.75 0 0 1 42.75 14V30A12.75 12.75 0 0 1 30 42.75H14A12.75 12.75 0 0 1 1.25 30V14A12.75 12.75 0 0 1 14 1.25Z"
            pathLength="100"
          />
          <path
            class="pr"
            id="meRing"
            style="stroke-dasharray: 0 100"
            d="M22 1.25H30A12.75 12.75 0 0 1 42.75 14V30A12.75 12.75 0 0 1 30 42.75H14A12.75 12.75 0 0 1 1.25 30V14A12.75 12.75 0 0 1 14 1.25Z"
            pathLength="100"
          />
        </svg>
      </button>
      <div class="stack">
        <button id="btnSound" aria-label="Sound"></button>
        <button id="btnLbl" aria-label="Map labels"></button>
        <button id="btnLoc" aria-label="Recenter">
          <svg class="i" viewBox="0 0 24 24">
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
            <circle cx="12" cy="12" r="6" />
            <circle cx="12" cy="12" r="1.6" fill="currentColor" />
          </svg>
        </button>
      </div>
      <div class="vbox" id="vbox">
        <div class="vrow">
          <div class="pjfly" id="pjFly" role="menu" aria-label="Map view"></div>
          <button class="proj-btn" id="btnProj" aria-label="Map view" aria-haspopup="true" aria-expanded="false">
            EE
          </button>
        </div>
        <div class="vgeo" id="geoLegend" aria-label="Geoid height colours">
          <span class="ab" aria-hidden="true">Height</span><span class="mono hi">+80 m</span><i></i
          ><span class="mono lo">&minus;100 m</span
          ><button class="gsw" id="geoSw" role="switch" aria-checked="true" aria-label="Show geoid heights">
            <span class="knob"></span>
          </button>
        </div>
      </div>
      <div class="stack dk-only">
        <button id="zIn" aria-label="Zoom in">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="zOut" aria-label="Zoom out">
          <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
        </button>
      </div>
    </div>

    <button class="play" id="btnPlay">
      <svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px">
        <path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none" /></svg
      >Play<span class="dot2" id="dailyDot" hidden></span>
    </button>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-head" id="sheetHead">
        <div class="grab"></div>
        <div id="sheetTop"></div>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot" hidden></div>
    </div>
    <div id="quizLayer"></div>
    <div class="scalebar" id="scale" aria-hidden="true">
      <div class="sb-l"><span>0</span><span id="sbMid"></span><span id="sbEnd"></span></div>
      <div class="sb-bar"><i></i><i></i></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
    <script src="data/geo.js"></script>
    <script src="js/core.js"></script>
    <script src="js/map.js"></script>
    <script src="js/globe.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
